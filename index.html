    <meta property="og:type" content="website" />

    <meta property="og:title" content="HappyBags Kenya | Bags and Packaging in Nairobi" />

    <!-- Schema.org structured data -->
    <script id="structured-data" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Store",
          "@id": "https://happybags.co.ke/#store",
          "name": "HappyBags Kenya",
          "url": "https://happybags.co.ke/",
          "logo": "https://happybags.co.ke/logo.png",
          "image": "https://happybags.co.ke/og-image.png",
          "description": "Shop quality bags and packaging supplies in Kenya. Find non-woven bags, gift bags, tote bags, khaki bags, cups, plates, straws and more from HappyBags Kenya.",

          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Nairobi",
            "addressCountry": "KE"
          },
          "areaServed": {
            "@type": "Country",
            "name": "Kenya"
          },
          "priceRange": "KSh 50 - KSh 5000",
          "currenciesAccepted": "KES",
          "paymentAccepted": "M-Pesa, Cash"
        },
        {
          "@type": "WebSite",
          "@id": "https://happybags.co.ke/#website",
          "url": "https://happybags.co.ke/",
          "name": "HappyBags Kenya",
          "publisher": {
            "@id": "https://happybags.co.ke/#store"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://happybags.co.ke/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
